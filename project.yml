name: AIContentMachine
options:
  bundleIdPrefix: com.abebait
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    DEVELOPMENT_ASSET_PATHS: "\"AIContentMachine/Preview\""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.abebait.AIContentMachine
targets:
  AIContentMachine:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AIContentMachine
        excludes:
          - Tests
    settings:
      base:
        PRODUCT_NAME: AIContentMachine
        INFOPLIST_KEY_CFBundleDisplayName: AI Content Machine
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: AI Content Machine exports formatted content snapshots and files to share.
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    scheme:
      testTargets:
        - AIContentMachineTests
  AIContentMachineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - AIContentMachine/Tests
    dependencies:
      - target: AIContentMachine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abebait.AIContentMachineTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIContentMachine.app/AIContentMachine"
        BUNDLE_LOADER: "$(TEST_HOST)"
